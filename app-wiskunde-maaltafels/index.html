<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maaltafels – Leren is fijn</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <a href="../index.html" class="back-btn" aria-label="Terug naar de startpagina">&larr; Start</a>
    <div class="title">
      <h1>Maaltafels</h1>
      <p class="subtitle">OLV SGR L2 – Wiskunde</p>
    </div>
    <div class="score" aria-live="polite" title="Aantal juiste oefeningen">
      <span class="star">&#9733;</span>
      <span id="score">0</span>
    </div>
  </header>

  <main class="layout">

    <!-- Instellingen: altijd zichtbaar, links van het spel -->
    <aside class="settings" aria-label="Instellingen">
      <h2>Welke tafels?</h2>
      <div id="tableButtons" class="table-grid"></div>
      <div class="settings-actions">
        <button type="button" id="selectAll" class="small-btn">Alles</button>
        <button type="button" id="selectNone" class="small-btn">Geen</button>
      </div>
      <p id="settingsHint" class="settings-hint"></p>
    </aside>

    <!-- Spel -->
    <section class="game">
      <div class="exercise" id="exercise">
        <span id="factorA">?</span>
        <span class="op">&times;</span>
        <span id="factorB">?</span>
        <span class="op">=</span>
        <span id="answerSlot" class="answer-slot">?</span>
      </div>

      <div class="canvas-wrap" id="canvasWrap">
        <canvas id="pad" aria-label="Schrijfvak voor je antwoord"></canvas>
        <span class="pad-label">Schrijf hier je antwoord</span>
      </div>

      <div class="controls">
        <button type="button" id="clearBtn" class="btn btn-secondary">Wissen</button>
        <button type="button" id="undoBtn" class="btn btn-secondary">Stap terug</button>
        <button type="button" id="checkBtn" class="btn btn-primary">Klaar</button>
      </div>

      <div id="feedback" class="feedback" aria-live="polite"></div>
      <div id="hint" class="hint" aria-live="polite"></div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
