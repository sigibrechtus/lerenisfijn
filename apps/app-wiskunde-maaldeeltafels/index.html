<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Maal- en deeltafels – Leren is fijn</title>
  <link rel="stylesheet" href="style.css?v=6">
  <link rel="stylesheet" href="../../app-theme.css?v=6">
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script defer src="../../supabase-client.js"></script>
<script defer src="script.js?v=7"></script>
</head>
<body>
  <header class="topbar app-header-layout">
    <a class="app-home-link" href="../../index.html">← Overzicht</a>
    <div class="title app-header-title">
      <h1>Maal- en deeltafels</h1>
      <p class="subtitle">OLV SGR L2 – Wiskunde</p>
    </div>
    <div class="score-box">Score <span id="score">0</span></div>
  </header>

  <main class="layout">
    <!-- Instellingen (links) -->
    <aside class="settings" aria-label="Instellingen">
      <section class="settings-block">
        <h2>Soort oefening</h2>
        <div class="type-grid" role="group" aria-label="Soort oefening">
          <button type="button" class="type-btn type-mul" data-type="mul" aria-pressed="true">&times; Maal</button>
          <button type="button" class="type-btn type-div" data-type="div" aria-pressed="false">: Deel</button>
          <button type="button" class="type-btn type-mix" data-type="mix" aria-pressed="false">Beide</button>
        </div>
      </section>

      <section class="settings-block">
        <h2>Kies je tafels</h2>
        <div id="tableButtons" class="table-grid"></div>
        <div class="quick">
          <button type="button" id="selectAll" class="small-btn small-all">Alles</button>
          <button type="button" id="selectNone" class="small-btn small-none">Geen</button>
        </div>
        <p id="settingsHint" class="settings-hint"></p>
      </section>

      <section class="settings-block">
        <h2>Schrijven met</h2>
        <div class="mode-grid" role="group" aria-label="Schrijven met">
          <button type="button" class="mode-btn mode-pen" data-mode="pen" aria-pressed="true">&#9998; Potlood</button>
          <button type="button" class="mode-btn mode-hand" data-mode="hand" aria-pressed="false">&#9757; Vinger</button>
          <button type="button" class="mode-btn mode-keyboard" data-mode="keyboard" aria-pressed="false">⌨ Toetsenbord</button>
        </div>
        <p id="modeHint" class="settings-hint"></p>
      </section>
    </aside>

    <!-- Spel (rechts) -->
    <section class="game">
      <div id="exercise" class="exercise">
        <span id="factorA" class="num num-a">?</span>
        <span id="opSign" class="op">&times;</span>
        <span id="factorB" class="num num-b">?</span>
        <span class="op">=</span>
        <span id="answerSlot" class="answer">?</span>
      </div>

      <div id="canvasWrap" class="canvas-wrap">
        <canvas id="pad"></canvas>
        <span class="placeholder">Schrijf hier je antwoord</span>
        <div id="keyboardWrap" class="keyboard-wrap" hidden>
          <label for="keyboardAnswer">Typ je antwoord</label>
          <input id="keyboardAnswer" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" enterkeyhint="done" aria-describedby="feedback">
        </div>
      </div>

      <div class="controls">
        <button type="button" id="undoBtn" class="btn btn-undo">&#8630; Stap terug</button>
        <button type="button" id="clearBtn" class="btn btn-clear">&#10005; Wissen</button>
        <button type="button" id="checkBtn" class="btn btn-check">&#10003; Controleer</button>
      </div>

      <p id="feedback" class="feedback" aria-live="polite"></p>
      <p id="hint" class="hint"></p>
    </section>
  </main>

  
</body>
</html>
