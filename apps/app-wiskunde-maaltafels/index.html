<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Maaltafels – Leren is fijn</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="back" href="../../index.html">&larr; Terug</a>
    <div class="title">
      <h1>Maaltafels</h1>
      <p class="subtitle">OLV SGR L2 – Wiskunde</p>
    </div>
    <div class="score-box">Score: <span id="score">0</span></div>
  </header>

  <main class="layout">
    <!-- Instellingen (links) -->
    <aside class="settings" aria-label="Instellingen">
      <h2>Tafels</h2>
      <div id="tableButtons" class="table-grid"></div>
      <div class="quick">
        <button type="button" id="selectAll" class="small-btn">Alles</button>
        <button type="button" id="selectNone" class="small-btn">Geen</button>
      </div>
      <p id="settingsHint" class="settings-hint"></p>

      <h2>Schrijven met</h2>
      <div class="mode-grid" role="group" aria-label="Schrijven met">
        <button type="button" class="mode-btn" data-mode="pen" aria-pressed="true">Potlood</button>
        <button type="button" class="mode-btn" data-mode="hand" aria-pressed="false">Vinger</button>
      </div>
      <p id="modeHint" class="settings-hint"></p>
    </aside>

    <!-- Spel (rechts) -->
    <section class="game">
      <div id="exercise" class="exercise">
        <span id="factorA" class="num">?</span>
        <span class="op">&times;</span>
        <span id="factorB" class="num">?</span>
        <span class="op">=</span>
        <span id="answerSlot" class="answer">?</span>
      </div>

      <div id="canvasWrap" class="canvas-wrap">
        <canvas id="pad"></canvas>
        <span class="placeholder">Schrijf hier je antwoord</span>
      </div>

      <div class="controls">
        <button type="button" id="undoBtn" class="btn">Stap terug</button>
        <button type="button" id="clearBtn" class="btn">Wissen</button>
        <button type="button" id="checkBtn" class="btn primary">Controleer</button>
      </div>

      <p id="feedback" class="feedback" aria-live="polite"></p>
      <p id="hint" class="hint"></p>
    </section>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
