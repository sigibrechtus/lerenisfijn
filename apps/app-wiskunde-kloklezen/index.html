<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kloklezen - OLV SGR L2 - Wiskunde</title>
<link rel="stylesheet" href="style.css?v=2">
  <link rel="stylesheet" href="../../app-theme.css?v=14">
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script defer src="../../supabase-client.js"></script>
<script defer src="../../app-effects.js?v=2"></script>
<script defer src="script.js?v=20"></script>
</head>
<body>
<div class="app">

  <header class="top app-header-layout">
    <a class="app-home-link" href="../../index.html">← Overzicht</a>
    <h1 class="app-header-title">🕒 Kloklezen</h1>
    <div class="app-header-actions"><a class="app-settings-button" href="#exercise-settings">Instellingen</a><div class="score-badge app-score-badge">Score: <span id="score">0</span></div></div>
  </header>

  <section id="exercise-settings" class="settings-panel">
    <h2>Oefentype</h2>
    <div class="mode-cards" id="modeCards">
      <button type="button" class="mode-card" data-mode="read" aria-pressed="true">
        <span class="mode-icon">🕐</span>
        <span class="mode-label">Klok aflezen</span>
      </button>
      <button type="button" class="mode-card" data-mode="set" aria-pressed="false">
        <span class="mode-icon">📝</span>
        <span class="mode-label">Klok instellen</span>
      </button>
      <button type="button" class="mode-card" data-mode="calc" aria-pressed="false">
        <span class="mode-icon">➕</span>
        <span class="mode-label">Rekenen met tijd</span>
      </button>
    </div>
  </section>

  <section class="exercise" id="exercise">

    <div class="clock-col">
      <h3 id="leftLabel">Hoe laat is het?</h3>

    <div class="clock-wrap" id="leftClockWrap">
      <svg id="clockLeft" class="clock" viewBox="0 0 200 200" width="180" height="180" aria-label="gegeven klok"></svg>
    </div>

      <p class="phrase-display" id="phraseDisplay" hidden></p>

      <div class="delta-card" id="deltaCard" hidden>
        <span class="delta-icon" id="deltaIcon">🎬</span>
        <span class="delta-sentence" id="deltaSentence"></span>
      </div>
    </div>

    <div class="answer-col">
      <h3 id="rightLabel">Zet de tijd</h3>

      <div class="digital-input" id="digitalInput">
        <div class="spinner">
          <button type="button" class="spin-btn" data-target="hour" data-dir="1">▲</button>
          <div class="spin-value" id="hourValue">12</div>
          <button type="button" class="spin-btn" data-target="hour" data-dir="-1">▼</button>
        </div>
        <div class="colon">:</div>
        <div class="spinner">
          <button type="button" class="spin-btn" data-target="minute" data-dir="1">▲</button>
          <div class="spin-value" id="minuteValue">00</div>
          <button type="button" class="spin-btn" data-target="minute" data-dir="-1">▼</button>
        </div>
      </div>

      <div class="clock-wrap" id="answerClockWrap" hidden>
        <svg id="clockRight" class="clock answer-clock" viewBox="0 0 200 200" width="180" height="180" aria-label="jouw klok"></svg>
        <p class="clock-hint">Sleep de wijzers naar de juiste tijd.</p>
      </div>
    </div>

  </section>

  <div class="controls">
    <button type="button" id="checkBtn" class="btn primary">Controleer</button>
  </div>

  <p class="feedback" id="feedback" aria-live="polite"></p>
  <p class="hint" id="hint"></p>

</div>

</body>
</html>
