<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kloklezen - OLV SGR L2 - Wiskunde</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <header class="top">
    <a class="back-link" href="../../index.html">⬅ Terug naar overzicht</a>
    <h1>🕒 Kloklezen</h1>
    <div class="score-badge">Score: <span id="score">0</span></div>
  </header>

  <section class="settings-panel">
    <h2>Oefentype</h2>
    <div class="mode-cards" id="modeCards">
      <button type="button" class="mode-card" data-mode="read" aria-pressed="true" style="--card-color:#4b7bec">
        <span class="mode-icon">🕐</span>
        <span class="mode-label">Klok aflezen</span>
      </button>
      <button type="button" class="mode-card" data-mode="set" aria-pressed="false" style="--card-color:#f7b731">
        <span class="mode-icon">📝</span>
        <span class="mode-label">Klok instellen</span>
      </button>
      <button type="button" class="mode-card" data-mode="calc" aria-pressed="false" style="--card-color:#20bf6b">
        <span class="mode-icon">➕</span>
        <span class="mode-label">Rekenen met tijd</span>
      </button>
    </div>
  </section>

  <section class="exercise" id="exercise">

    <div class="clock-col">
      <h3 id="leftLabel">Hoe laat is het?</h3>

      <div class="clock-wrap" id="leftClockWrap">
        <svg id="clockLeft" class="clock" viewBox="0 0 200 200" aria-label="gegeven klok"></svg>
      </div>

      <p class="phrase-display" id="phraseDisplay" hidden></p>

      <div class="delta-card" id="deltaCard" hidden>
        <span class="delta-icon" id="deltaIcon">🎬</span>
        <span class="delta-sentence" id="deltaSentence"></span>
      </div>
    </div>

    <div class="answer-col">
      <h3 id="rightLabel">Zet de tijd</h3>

      <div class="digital-input" id="digitalInput">
        <div class="spinner">
          <button type="button" class="spin-btn" data-target="hour" data-dir="1">▲</button>
          <div class="spin-value" id="hourValue">12</div>
          <button type="button" class="spin-btn" data-target="hour" data-dir="-1">▼</button>
        </div>
        <div class="colon">:</div>
        <div class="spinner">
          <button type="button" class="spin-btn" data-target="minute" data-dir="1">▲</button>
          <div class="spin-value" id="minuteValue">00</div>
          <button type="button" class="spin-btn" data-target="minute" data-dir="-1">▼</button>
        </div>
      </div>

      <div class="clock-wrap" id="answerClockWrap" hidden>
        <svg id="clockRight" class="clock answer-clock" viewBox="0 0 200 200" aria-label="jouw klok"></svg>
        <p class="clock-hint">Sleep de wijzers naar de juiste tijd.</p>
      </div>
    </div>

  </section>

  <div class="controls">
    <button type="button" id="checkBtn" class="btn primary">Controleer</button>
  </div>

  <p class="feedback" id="feedback" aria-live="polite"></p>
  <p class="hint" id="hint"></p>

</div>
<script src="script.js"></script>
</body>
</html>
