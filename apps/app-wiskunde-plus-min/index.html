<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ff7a45">
  <title>Plus en min – Leren is fijn</title>
  <link rel="stylesheet" href="style.css?v=3">
  <link rel="stylesheet" href="../../app-theme.css?v=1">
  
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script defer src="../../supabase-client.js"></script>
<script defer src="script.js?v=3"></script>
</head>
<body>
  <header class="topbar">
    <a class="back-link" href="../../index.html">← Alle oefeningen</a>
    <h1>Plus en min</h1>
    <p>Rekenoefeningen voor het tweede leerjaar</p>
  </header>

  <main class="app-shell">
    <section class="panel" aria-label="Rekenoefening">
      <div class="toolbar">
        <label for="limit">Rekenen tot</label>
        <select id="limit" aria-label="Kies het hoogste getal">
          <option value="20">20</option>
          <option value="100">100</option>
        </select>
        <button class="button button--quiet" id="new-round" type="button">Nieuwe reeks</button>
      </div>

      <p class="round-note">Tien vragen. Kies je antwoord en druk op <strong>Controleer</strong>.</p>

      <section id="quiz" aria-labelledby="question-title">
        <div class="score-row">
          <span id="progress">Vraag 1 van 10</span>
          <span id="score">Goed: 0</span>
        </div>

        <h2 id="question-title" class="question" aria-live="polite">Klaar voor de eerste vraag?</h2>

        <div class="operation-options" role="group" aria-label="Soort oefening">
          <button type="button" class="operation-btn operation-plus" data-operation="plus" aria-pressed="false">＋ Plus</button>
          <button type="button" class="operation-btn operation-minus" data-operation="minus" aria-pressed="false">− Min</button>
          <button type="button" class="operation-btn operation-mix" data-operation="mix" aria-pressed="true">Beide</button>
        </div>

        <div class="input-options" role="group" aria-label="Antwoord geven met">
          <button type="button" class="input-mode-btn input-mode-pen" data-input-mode="pen" aria-pressed="false">✎ Potlood</button>
          <button type="button" class="input-mode-btn input-mode-hand" data-input-mode="hand" aria-pressed="false">☝ Vinger</button>
          <button type="button" class="input-mode-btn input-mode-keyboard" data-input-mode="keyboard" aria-pressed="true">⌨ Toetsenbord</button>
        </div>
        <p id="mode-hint" class="mode-hint" aria-live="polite"></p>

        <div id="canvasWrap" class="canvas-wrap keyboard-mode">
          <canvas id="pad" aria-label="Schrijf hier je antwoord"></canvas>
          <span class="placeholder">Schrijf hier je antwoord</span>
          <div id="keyboardWrap" class="keyboard-wrap">
            <label class="sr-only" for="answer">Typ je antwoord</label>
            <input id="answer" name="answer" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" enterkeyhint="done" aria-describedby="feedback">
          </div>
        </div>
        <div class="writing-controls">
          <button class="button button--quiet" id="undo-button" type="button" hidden>Stap terug</button>
          <button class="button button--quiet" id="clear-button" type="button" hidden>Wissen</button>
        </div>
        <form id="answer-form" class="answer-form">
          <button class="button" id="submit-button" type="submit">Controleer</button>
        </form>

        <p id="feedback" class="feedback" role="status" aria-live="polite">Vul je antwoord in om te beginnen.</p>
      </section>

      <section id="summary" class="summary" hidden aria-live="polite">
        <div class="summary-star" aria-hidden="true">★</div>
        <h2 id="summary-title">Reeks klaar!</h2>
        <p id="summary-score"></p>
        <button class="button" id="again-button" type="button">Nog een reeks</button>
      </section>
    </section>
  </main>

  <footer class="footer">Leren is fijn</footer>
</body>
</html>
