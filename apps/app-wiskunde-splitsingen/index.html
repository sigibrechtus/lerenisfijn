<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Splitsen">
<title>Splitsen - Tijdrace – Leren is fijn</title>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script defer src="../../supabase-client.js"></script>
<script defer src="script.js"></script>
<link rel="stylesheet" href="style.css?v=3">
  <link rel="stylesheet" href="../../app-theme.css?v=12">
</head>
<body>

<!-- STARTSCHERM -->
<section id="start" class="scherm actief">
    <header class="topbar app-header-layout">
      <a class="app-home-link" href="../../index.html">← Overzicht</a>
      <h1 id="startTitel" class="app-header-title">Splitsen tot 10</h1>
      <button id="instelBtn" class="app-settings-button" type="button">Instellingen</button>
    </header>

    <div id="startTekst" class="kaart"></div>
    <div>
        <button id="startBtn" class="knop groen">Start</button>
    </div>
    <p id="record"></p>
</section>

<!-- INSTELLINGEN -->
<section id="instellingen" class="scherm">
    <h1>Instellingen</h1>
    <div class="kaart instel">
        <div class="rij">
            <div class="rij-tekst">Doel<small>Aantal juiste splitsingen</small></div>
            <div class="stapper"><button data-veld="doel" data-richting="-1">−</button><span id="waarde-doel"></span><button data-veld="doel" data-richting="1">+</button></div>
        </div>
        <div class="rij">
            <div class="rij-tekst">Speeltijd<small>In minuten</small></div>
            <div class="stapper"><button data-veld="minuten" data-richting="-1">−</button><span id="waarde-minuten"></span><button data-veld="minuten" data-richting="1">+</button></div>
        </div>
        <div class="rij">
            <div class="rij-tekst">Splitsen tot<small>Grootste hoofdgetal</small></div>
            <div class="stapper"><button data-veld="max" data-richting="-1">−</button><span id="waarde-max"></span><button data-veld="max" data-richting="1">+</button></div>
        </div>
        <label class="rij">
            <div class="rij-tekst">Splitsingen met 0<small>Bijvoorbeeld 6 = 6 + 0</small></div>
            <input type="checkbox" id="nulToggle">
        </label>
    </div>
    <p id="instelMelding"></p>
    <div>
        <button id="terugBtn" class="knop groen">Klaar</button>
        <button id="standaardBtn" class="knop grijs klein">Standaardwaarden</button>
        <button id="recordWisBtn" class="knop rood klein">Beste scores wissen</button>
    </div>
</section>

<!-- SPEELSCHERM -->
<section id="spel" class="scherm">
    <header class="topbar app-header-layout game-header">
        <button id="stopBtn" class="app-home-link" type="button">← Startscherm</button>
        <h1 id="gameTitel" class="app-header-title">Splitsen tot 10</h1>
        <div class="app-header-metrics" aria-label="Spelstand">
            <div id="tellerVak" class="hoek app-header-metric">
                <span class="hoek-label">Score</span>
                <span id="teller">0<small> / 30</small></span>
                <div class="doelbalk"><div id="doelVulling"></div></div>
            </div>
            <div id="timerVak" class="hoek app-header-metric">
                <span class="hoek-label">Tijd</span>
                <span id="timer">3:00</span>
            </div>
        </div>
    </header>

    <div id="doelBereikt" class="verborgen">Doel bereikt! Ga zo door!</div>
    <div id="opdracht">Splits 7</div>
    <div id="driehoek">
        <svg viewBox="0 0 320 270">
            <line x1="160" y1="50" x2="70" y2="215" stroke="#34495e" stroke-width="5"/>
            <line x1="160" y1="50" x2="250" y2="215" stroke="#34495e" stroke-width="5"/>
        </svg>
        <div id="top" class="bol hoofd">7</div>
        <div id="links" class="bol deel">3</div>
        <div id="rechts" class="bol leeg">?</div>
    </div>
    <div id="pot"></div>
    <p id="melding"></p>
</section>

<!-- EINDSCHERM -->
<section id="einde" class="scherm">
    <h1 id="eindTitel"></h1>
    <div id="eindTekst" class="kaart"></div>
    <div>
        <button id="opnieuwBtn" class="knop groen">Nog eens</button>
        <button id="menuBtn" class="knop grijs">Startscherm</button>
    </div>
</section>



</body>
</html>
