name: Pumpkin Race regression tests
on:
  pull_request:
    paths:
      - 'games/moonlight-hollow/**'
      - 'tests/pumpkin-race*.test.cjs'
      - 'tests/moonlight-mini-game-world.test.cjs'
      - 'tests/moonlight-broom-head-look.test.cjs'
      - 'tests/moonlight-attraction-ui.test.cjs'
      - '.github/workflows/pumpkin-race-tests.yml'
  push:
    branches: [main]
    paths:
      - 'games/moonlight-hollow/**'
      - 'tests/pumpkin-race*.test.cjs'
      - 'tests/moonlight-attraction-ui.test.cjs'
      - 'tests/moonlight-pbr.test.cjs'
      - 'tests/moonlight-mini-game-world.test.cjs'
      - 'games/moonlight-hollow/mini-game-world.js'
      - 'tests/moonlight-pbr-world-smoke.cjs'
      - '.github/workflows/pumpkin-race-tests.yml'
  workflow_dispatch:
jobs:
  race-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Babylon canvas test dependency
        run: npm install --no-save --no-package-lock @napi-rs/canvas
      - name: Physically based surface maps and UV seams
        run: node --test tests/moonlight-pbr.test.cjs
      - name: Full Moonlight world PBR integration
        run: node tests/moonlight-pbr-world-smoke.cjs
      - name: Broom Flight full-screen arena and camera regression
        run: node tests/moonlight-mini-game-world.test.cjs
      - name: Broom touch head-look and recenter
        run: node --test tests/moonlight-broom-head-look.test.cjs
      - name: Race physics and questions
        run: node tests/pumpkin-race.test.cjs
      - name: Replay menus and profile isolation
        run: node --test tests/moonlight-attraction-ui.test.cjs
      - name: Babylon race integration (NullEngine)
        run: node tests/pumpkin-race-world.test.cjs
