name: Moonlight Hollow - vendor verified 3D models
on:
  push:
    branches: [main]
    paths:
      - 'games/moonlight-hollow/assets/model-library.json'
      - '.github/workflows/moonlight-model-vendor.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: moonlight-asset-vendor-main
  cancel-in-progress: false
jobs:
  vendor-models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download source-pinned CC0 meshes and check Git blob digests
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, struct, urllib.request
          folder=pathlib.Path('games/moonlight-hollow')
          info=json.loads((folder/'assets/model-library.json').read_text())
          repo=info['source']['repository']
          rev=info['source']['commit']
          assert repo=='Hidencod/tge-assets' and len(rev)==40
          assert info['source']['license']=='CC0-1.0'
          total=0
          for model in info['assets']:
              source=pathlib.PurePosixPath(model['sourcePath'])
              destination=pathlib.PurePosixPath(model['path'])
              assert source.parts[0]=='packs' and source.suffix=='.glb'
              assert destination.parts[:3]==('assets','models','kenney')
              assert '..' not in source.parts and '..' not in destination.parts
              assert model['license']=='CC0-1.0'
              assert model['bytes']<1500000
              url=f'https://raw.githubusercontent.com/{repo}/{rev}/{source}'
              req=urllib.request.Request(url,headers={'User-Agent':'MoonlightHollowAssetVender/1'})
              with urllib.request.urlopen(req,timeout=45) as response:
                  content=response.read(1500001)
              assert len(content)==model['bytes'],f'Unexpected size: {source}'
              assert content[:4]==b'glTF' and struct.unpack_from('<I',content,4)[0]==2
              assert struct.unpack_from('<I',content,8)[0]==len(content)
              digest=hashlib.sha1(f'blob {len(content)}\0'.encode()+content).hexdigest()
              assert digest==model['gitBlobSha'],f'Bad Git SHA: {source}'
              path=folder/pathlib.Path(str(destination))
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(content)
              total+=len(content)
              print('verified:',destination,model['bytes'],'bytes')
          assert total<12000000
          print(len(info['assets']),'models verified;',total,'bytes')
          PY
      - name: Vendor matching Babylon glTF loader
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,urllib.request
          url='https://cdn.jsdelivr.net/npm/babylonjs-loaders@9.30.0/babylonjs.loaders.min.js'
          req=urllib.request.Request(url,headers={'User-Agent':'MoonlightHollowAssetVendor/1'})
          with urllib.request.urlopen(req,timeout=60) as response:
              data=response.read(8000000)
          assert len(data)>100000 and b'GLTF' in data.upper(), 'Babylon loader validation failed'
          path=pathlib.Path('games/moonlight-hollow/vendor/babylonjs.loaders.min.js')
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_bytes(data)
          print('Bundled GLB importer',len(data),'bytes')
          PY
      - name: Commit approved asset bytes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games/moonlight-hollow/assets/models/kenney games/moonlight-hollow/vendor/babylonjs.loaders.min.js
          if ! git diff --cached --quiet; then
            git commit -m 'assets: add SHA-verified CC0 GLB library and Babylon loader'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
