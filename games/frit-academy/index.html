<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173f38"><title>Frit’Academy 🍟 · Leren is fijn</title><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css?v=3"><script defer src="engine.js?v=2"></script><script defer src="music.js?v=3"></script><script defer src="app.js?v=3"></script></head>
<body>
<header class="topbar"><a id="back" href="../../index.html">← Overzicht</a><a class="brand" href="#"><span aria-hidden="true">🍟</span> Frit’Academy <small id="tagline"></small></a><div class="topbar-actions"><button id="music-toggle" type="button" aria-pressed="true">♫ Start muziek</button><button id="settings-open" type="button">Instellingen</button></div></header>
<main id="main">
<section id="settings" class="settings-panel" hidden aria-labelledby="settings-title"><div class="section-line"><h2 id="settings-title"></h2><button id="settings-close" type="button">×</button></div><div class="settings-grid"><label><span id="lang-label"></span><select id="language"><option value="nl">Nederlands</option><option value="fr">Français</option></select></label><label><span id="profile-label"></span><select id="profile-select"></select></label><label class="sound-field"><input id="sound" type="checkbox"><span id="sound-label"></span></label><label><span id="volume-label"></span><input id="volume" type="range" min="0" max="100" step="10"></label><label class="sound-field"><input id="music" type="checkbox"><span id="music-label"></span></label><label><span id="music-volume-label"></span><input id="music-volume" type="range" min="0" max="100" step="5"></label></div><p id="music-note" class="quiet"></p><form id="profile-form"><label for="profile-name" id="new-profile-label"></label><input id="profile-name" maxlength="24" required autocomplete="off"><button id="profile-add" type="submit"></button></form><p id="privacy"></p><div class="settings-actions"><button id="sync" type="button"></button><a id="login-link" href="../../index.html#authPanel"></a><button id="export" type="button"></button></div><p id="save-status" role="status"></p><details><summary id="progress-label"></summary><div id="stats"></div></details></section>
<section id="lobby"><div class="hero"><div class="hero-copy"><span class="eyebrow" id="hero-kicker"></span><h1 id="hero-title"></h1><p id="hero-description"></p><button class="primary" id="start-shift" type="button"></button><p class="quiet" id="session-note"></p></div><div class="shop-art" aria-hidden="true"><div class="shop-sign">FRIT’ACADEMY</div><div class="awning"></div><div class="shop-window"><div class="fries-mascot"><i></i><i></i><i></i><i></i><i></i><div class="mascot-face">•ᴗ•</div></div><span class="chef-bubble">Mmm… 🍟</span></div><div class="shop-counter">🥔 &nbsp; 🧂 &nbsp; 🥣</div><div class="shop-door">OPEN</div></div></div><div class="section-line"><div><span class="eyebrow" id="station-kicker"></span><h2 id="station-title"></h2></div><span class="profile-pill" id="profile-pill"></span></div><div id="station-grid" class="station-grid"></div><section class="passport"><div><h2 id="passport-title"></h2><p id="passport-note"></p></div><div id="unlocks" class="unlocks"></div></section></section>
<section id="game" hidden><div class="shift-bar"><button id="end-shift" type="button"></button><span id="shift-progress"></span><span id="station-name"></span></div><div class="order-scene"><div class="customer"><span id="customer-icon" aria-hidden="true"></span><strong id="customer-name"></strong></div><div class="order-ticket"><span class="eyebrow" id="order-label"></span><h1 id="order-text" tabindex="-1"></h1><p id="customer-dialogue"></p></div><div class="mini-chef" aria-hidden="true">🍟<span>•ᴗ•</span></div></div><div class="process" id="process"></div><div class="workbench"><p id="howto" class="instructions"></p><div id="activity"></div><div class="action-row"><button id="hint" type="button"></button><button id="clear" type="button"></button><button id="check" class="primary" type="button"></button><button id="next" class="primary" type="button" hidden></button></div><p id="feedback" role="status" aria-live="polite"></p><div id="hint-box" hidden></div></div></section>
<section id="summary" class="summary" hidden><div class="summary-icon" aria-hidden="true">🍟✨</div><h1 id="summary-title" tabindex="-1"></h1><p id="summary-copy"></p><div id="summary-rewards"></div><button id="another" class="primary" type="button"></button><button id="home" type="button"></button></section>
</main><footer id="footer"></footer><div id="drag-ghost" class="drag-ghost" hidden aria-hidden="true"></div><noscript>Activeer JavaScript om te spelen. / Activez JavaScript pour jouer.</noscript></body></html>
