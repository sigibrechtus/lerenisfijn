<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leren is fijn – Kies een oefening</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="topbar">
    <h1>Leren is fijn</h1>
    <p class="subtitle">Kies een oefening om te starten.</p>
  </header>

  <main class="card-grid">

    <a href="./apps/app-taal-spelling/index.html" class="card card--taal">
      <span class="card-icon" aria-hidden="true">abc</span>
      <div class="card-body">
        <h2>Themadictee</h2>
        <p>OLV SGR L2 – Taal – Spelling</p>
      </div>
      <div class="card-tags">
        <span class="tag">L2</span>
        <span class="tag tag--subject">Taal</span>
      </div>
    </a>

    <a href="./apps/app-wiskunde-splitsingen/index.html" class="card card--wiskunde">
      <span class="card-icon" aria-hidden="true">2+3</span>
      <div class="card-body">
        <h2>Splitsingen</h2>
        <p>OLV SGR L2 – Wiskunde</p>
      </div>
      <div class="card-tags">
        <span class="tag">L2</span>
        <span class="tag tag--subject">Wiskunde</span>
      </div>
    </a>

    <a href="./apps/app-wiskunde-maaldeeltafels/index.html" class="card card--wiskunde">
      <span class="card-icon" aria-hidden="true">&times;&divide;</span>
      <div class="card-body">
        <h2>Maal- en deeltafels</h2>
        <p>OLV SGR L2 – Wiskunde</p>
      </div>
      <div class="card-tags">
        <span class="tag">L2</span>
        <span class="tag tag--subject">Wiskunde</span>
      </div>
    </a>

    <a href="./apps/app-wiskunde-kloklezen/index.html" class="card card--wiskunde">
      <span class="card-icon" aria-hidden="true"><span class="clock"></span></span>
      <div class="card-body">
        <h2>Kloklezen</h2>
        <p>OLV SGR L3 – Wiskunde</p>
      </div>
      <div class="card-tags">
        <span class="tag">L3</span>
        <span class="tag tag--subject">Wiskunde</span>
      </div>
    </a>

  </main>

  <footer class="footer">Leren is fijn</footer>

</body>
</html>
